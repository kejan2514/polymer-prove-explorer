name: Sync Polymer Chain Health

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-polymer-health.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Polymer chain health
        shell: bash
        env:
          POLYMER_API_KEY: ${{ secrets.POLYMER_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p data

          PAYLOAD='{"jsonrpc":"2.0","id":1,"method":"info_health","params":[{}]}'
          ENDPOINTS=(
            'https://api.polymer.zone/v1/'
            'https://api.polymer.zone/v1'
          )

          AUTH_ARGS=()
          if [[ -n "${POLYMER_API_KEY:-}" ]]; then
            AUTH_ARGS=(-H "Authorization: Bearer ${POLYMER_API_KEY}")
          fi

          SUCCESS=0
          for ENDPOINT in "${ENDPOINTS[@]}"; do
            echo "Requesting Polymer health from ${ENDPOINT}"
            HTTP_CODE=$(curl \
              --http1.1 \
              --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Origin: https://dashboard.polymerlabs.org' \
              -H 'Referer: https://dashboard.polymerlabs.org/' \
              -H 'Sec-Fetch-Mode: cors' \
              -H 'Sec-Fetch-Site: cross-site' \
              "${AUTH_ARGS[@]}" \
              -X POST "${ENDPOINT}" \
              --data "${PAYLOAD}" \
              -o /tmp/polymer-health-raw.json \
              -w '%{http_code}')

            echo "HTTP ${HTTP_CODE}"
            if [[ "${HTTP_CODE}" =~ ^2 ]]; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/polymer-health-raw.json')
          raw = json.loads(p.read_text(encoding='utf-8'))
          status = raw.get('result', {}).get('status', {})
          if not isinstance(status, dict) or not status:
              raise SystemExit(1)
          PY
              then
                SUCCESS=1
                break
              fi
            fi

            echo 'Response body:'
            cat /tmp/polymer-health-raw.json || true
            echo
          done

          if [[ "${SUCCESS}" != '1' ]]; then
            echo 'Polymer health API did not return a valid status map.'
            echo 'If the endpoint now requires authentication, add POLYMER_API_KEY as a repository Actions secret.'
            exit 1
          fi

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open('/tmp/polymer-health-raw.json', encoding='utf-8') as f:
              raw = json.load(f)

          status = raw['result']['status']
          out = {
              'updatedAt': datetime.now(timezone.utc).isoformat(),
              'source': 'https://api.polymer.zone/v1/ info_health',
              'status': status,
          }

          with open('data/polymer-health.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, separators=(',', ':'))
          PY

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- data/polymer-health.json; then
            echo 'No health changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/polymer-health.json
          git commit -m 'data: refresh Polymer chain health'
          git push
